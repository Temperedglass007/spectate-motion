<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9e5db"><title>Race Centre — SPECTATE MOTION</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e5db}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe title="SPECTATE MOTION Race Centre" src="/race-centre-source" loading="eager"></iframe><script>(function(){const frame=document.querySelector('iframe');frame.addEventListener('load',function(){const d=frame.contentDocument;if(!d)return;const schedule=d.querySelector('.schedule');if(!schedule)return;const cols=[...schedule.children];cols.forEach((col,ci)=>{const items=[...col.querySelectorAll('b')];items.forEach((b,i)=>{const small=b.nextElementSibling;if(!small)return;const state=small.querySelector('.session-state');if(!state)return;const isRace=ci===2&&/Grand Prix/i.test(b.textContent);state.classList.remove('next');state.classList.add(isRace?'next':'done');state.textContent=isRace?'Race today':'Completed';if(ci===1&&/Qualifying/i.test(b.textContent))state.textContent='Completed · Norris P1';if(ci===1&&/Sprint/i.test(b.textContent))state.textContent='Completed · Russell P1';});});const fresh=d.querySelector('.freshness');if(fresh){const spans=fresh.querySelectorAll('span');if(spans[0])spans[0].textContent='Updated 23 Aug';if(spans[1])spans[1].textContent='2026 Dutch Grand Prix / race day';const changed=fresh.querySelector('.changed');if(changed)changed.textContent='Race: 6:30 PM IST · 3:00 PM CEST';}const hero=d.querySelector('.race-hero p');if(hero)hero.textContent='The final Dutch Grand Prix at Zandvoort is now in its race-day phase. Practice, Sprint Qualifying, the Sprint and Grand Prix Qualifying are complete; the Grand Prix is the only remaining session. This desk provides source-labelled context rather than pretending to be a live timing feed.';const source=d.querySelector('.archive-note');if(source&&/Timing source:/i.test(source.textContent))source.textContent='Timing source: Formula1.com Dutch Grand Prix event information and race-week timing checks, refreshed 23 Aug 2026. Race start: 6:30 PM IST / 3:00 PM CEST.';const heading=[...d.querySelectorAll('.section-head h2')].find(h=>/Weekend timings/i.test(h.textContent));if(heading){const p=heading.parentElement.querySelector('p');if(p)p.textContent='Indian Standard Time is shown first for quick planning, with local Zandvoort time beneath it. Completed sessions are marked clearly; the Grand Prix remains the only upcoming session.';} });})();</script></body></html>
